# 构建时使用的第三方依赖版本；修改后重新运行 ./scripts/build-app.sh。
# 环境变量可临时覆盖这里的默认值，MIHOMO_BIN 仍可指定本地内核。

# https://github.com/MetaCubeX/mihomo/releases
MIHOMO_VERSION="${MIHOMO_VERSION:-v1.19.34}"

# https://github.com/MetaCubeX/metacubexd/releases
METACUBEXD_VERSION="${METACUBEXD_VERSION:-v1.274.6}"

# Geo 数据默认下载 latest，优先复用 vendor 缓存；也可填写 release 分支的完整提交哈希固定快照。
# https://github.com/MetaCubeX/meta-rules-dat/commits/release
GEO_VERSION="${GEO_VERSION:-latest}"
