name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -n "$LATEST_XCODE" ]]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Build and package macOS releases
        run: |
          mkdir -p dist
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"

          for ARCH in arm64 x86_64; do
            echo "==> Building $ARCH"
            TARGET_ARCH="$ARCH" VERSION="$VERSION" ./scripts/build-app.sh
            codesign --verify --deep --strict build/TinyClash.app

            ZIP_PATH="dist/TinyClash-${TAG}-macos-${ARCH}.zip"
            DMG_PATH="dist/TinyClash-${TAG}-macos-${ARCH}.dmg"

            ditto -c -k --sequesterRsrc --keepParent build/TinyClash.app "$ZIP_PATH"

            STAGE="dist/dmg-${ARCH}"
            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            cp -R build/TinyClash.app "$STAGE/TinyClash.app"
            ln -s /Applications "$STAGE/Applications"
            hdiutil create -volname "TinyClash" -srcfolder "$STAGE" -ov -format UDZO "$DMG_PATH"
            rm -rf "$STAGE"
          done

          (cd dist && shasum -a 256 *.zip *.dmg > checksums.txt)
          ls -lh dist/

      - name: Create or update GitHub Release
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.dmg dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.dmg dist/checksums.txt \
              --title "TinyClash $TAG" \
              --generate-notes
          fi
