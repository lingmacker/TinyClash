name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -n "$LATEST_XCODE" ]]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Build TinyClash.app (arm64)
        run: |
          TARGET_ARCH=arm64 ./scripts/build-app.sh
          codesign --verify --deep --strict build/TinyClash.app
          test -f build/TinyClash.app/Contents/Resources/AppIcon.icns
          test -f build/TinyClash.app/Contents/Resources/Assets.car
